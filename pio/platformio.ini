; platformio.ini -- three firmware images, for real hardware and for QEMU.
;
;   pio run -e gate                    build for a board
;   pio run -e gate -t upload
;   pio run -e qemu-gate               build for emulation
;   ../qemu/run.sh gate                boot it
;
; framework = espidf, not Arduino. The Arduino core owns task creation and core
; affinity, and the link task must have core 1 to itself.
;
; ESP-IDF VERSION
; ---------------
; tusb_msc_storage needs 5.x. Check what `pio run -e gate -v` reports before
; assuming; if it pins 4.x, point `platform` at a fork that ships 5.x rather
; than backporting TinyUSB.

[platformio]
default_envs = gate
src_dir = src

; ---- common -------------------------------------------------------------

[env]
platform = espressif32
framework = espidf
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.partitions = partitions.csv
board_build.flash_mode = qio
board_upload.flash_size = 4MB

monitor_speed = 115200
monitor_filters = esp_idf_exception_decoder, colorize

build_flags =
    -Wall
    -Wextra
    -Wshadow
    -Wno-unused-parameter

; The chip databases are embedded rather than read from the FAT volume: the
; volume is unavailable exactly when a PC has it mounted, and a gate has to
; work with nothing plugged in.
[chipdb]
files =
    ../data/chipdb/bn4r.chdb
    ../data/chipdb/bn4b.chdb
    ../data/chipdb/bn5p.chdb
    ../data/chipdb/bn5c.chdb
    ../data/chipdb/bn6g.chdb
    ../data/chipdb/bn6f.chdb

; ---- hardware images ----------------------------------------------------

[env:link]
build_flags = ${env.build_flags} -DVARIANT=VARIANT_LINK -DGBAGATE_VARIANT_NAME='"link"'

[env:gate]
build_flags =
    ${env.build_flags}
    -DVARIANT=VARIANT_GATE
    -DGBAGATE_VARIANT_NAME='"gate"'
    -DGBAGATE_HAS_CHIPDB=1
board_build.embed_files = ${chipdb.files}

[env:mini]
; The board built from a devkit, a display, switches, an SD module and two link
; sockets. 16 MB flash, so OTA fits -- which matters here because there is no
; USB storage and reflashing is the only way in.
board = esp32-s3-devkitc-1
board_build.partitions = partitions-16mb.csv
board_upload.flash_size = 16MB
build_flags =
    ${env.build_flags}
    -DVARIANT=VARIANT_MINI
    -DGBAGATE_VARIANT_NAME='"mini"'
    -DGBAGATE_HAS_CHIPDB=1
board_build.embed_files = ${chipdb.files}

[env:mini-bringup]
; The devkit with nothing on the SPI bus but the display.
;
; The card and the panel share SPI2, so bringing both up at once means a bus
; problem and a driver problem look identical. This build leaves the card off
; entirely -- not commented out, which is how that gets forgotten, but declared
; absent, so the Send Program mode reports no storage and says why.
board = esp32-s3-devkitc-1
board_build.partitions = partitions-16mb.csv
board_upload.flash_size = 16MB
build_flags =
    ${env.build_flags}
    -DVARIANT=VARIANT_MINI
    -DGBAGATE_VARIANT_NAME='"bringup"'
    -DGBAGATE_HAS_CHIPDB=1
    -DBOARD_HAS_SD=0
board_build.embed_files = ${chipdb.files}

[env:mini-supermini]
; The same firmware on a Supermini: fourteen usable pins against the devkit's
; forty-four. The link, display and card take twelve, so the switches move to
; an I2C expander -- two pins for sixteen.
;
; 4 MB flash rather than 16, so no OTA slots; the FAT partition is gone anyway
; because programs live on the card, which leaves the app room to spare.
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.partitions = partitions.csv
board_upload.flash_size = 4MB
build_flags =
    ${env.build_flags}
    -DVARIANT=VARIANT_MINI
    -DGBAGATE_VARIANT_NAME='"mini"'
    -DGBAGATE_HAS_CHIPDB=1
    -DBUTTONS_ON_EXPANDER=1
    -DBOARD_SUPERMINI=1
; GBAGATE_BOARD as tools/build_hw.sh passes it: board.h's Supermini pin map.
board_build.cmake_extra_args = -DBUTTONS_ON_EXPANDER=1 -DGBAGATE_BOARD=supermini
board_build.embed_files = ${chipdb.files}

[env:full]
build_flags =
    ${env.build_flags}
    -DVARIANT=VARIANT_FULL
    -DGBAGATE_VARIANT_NAME='"full"'
    -DGBAGATE_HAS_CHIPDB=1
board_build.embed_files = ${chipdb.files}

; ---- QEMU images --------------------------------------------------------
;
; Same firmware, cross-compiled the same way. `platform = native` would not
; produce an Xtensa binary at all -- QEMU runs the real image, not a host build.
;
; GBAGATE_QEMU switches the transfer source from the PHY to the UART bridge,
; because there are no pins under emulation and the PHY would busy-wait on a
; clock edge that never arrives.

[env:qemu]
extends = env
build_flags =
    ${env.build_flags}
    -DGBAGATE_QEMU=1
build_type = debug

[env:qemu-link]
extends = env:qemu
build_flags = ${env:qemu.build_flags} -DVARIANT=VARIANT_LINK -DGBAGATE_VARIANT_NAME='"link"'

[env:qemu-gate]
extends = env:qemu
build_flags =
    ${env:qemu.build_flags}
    -DVARIANT=VARIANT_GATE
    -DGBAGATE_VARIANT_NAME='"gate"'
    -DGBAGATE_HAS_CHIPDB=1
board_build.embed_files = ${chipdb.files}

[env:qemu-full]
extends = env:qemu
build_flags =
    ${env:qemu.build_flags}
    -DVARIANT=VARIANT_FULL
    -DGBAGATE_VARIANT_NAME='"full"'
    -DGBAGATE_HAS_CHIPDB=1
board_build.embed_files = ${chipdb.files}

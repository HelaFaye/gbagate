# The host suites, the GB-Link simulator, GB-Link's own software against it,
# and every hardware image. Nothing here needs a board.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'   # Mondays: GB-Link's upstream heads (compat-heads)

permissions:
  contents: read

# A newer push to the same branch supersedes a run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# A test that cannot run (no librfu, no browser) fails here instead of
# passing as a skip.
env:
  GBLINK_NO_SKIP: '1'

jobs:
  host:
    # make: the unit suites, the lint pass over pio/src and port/esp32s3, and
    # the GB-Link simulator suites (librfu is fetched from pret); then the
    # same at -O0, -O3 -flto and under ASan/UBSan.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      # mbe2e loads the real tester ROM, built from rom/ with a bare ARM toolchain.
      # Its packages are cached per runner image: a hit installs them from the
      # cache with no mirror at all (twice an update hung on a stalled mirror
      # for the whole job, before any of this repository's code ran).
      - name: cache gcc-arm-none-eabi's packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/apt-debs
          key: apt-gcc-arm-none-eabi-v1-${{ env.ImageOS }}-${{ env.ImageVersion }}
      - name: install gcc-arm-none-eabi
        timeout-minutes: 12
        run: |
          D="$HOME/apt-debs"
          if ls "$D"/*.deb >/dev/null 2>&1 && sudo apt-get install -y -q --no-download "$D"/*.deb; then
            echo "installed from the cache"; exit 0
          fi
          mkdir -p "$D/partial"
          A="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Dir::Cache::archives=$D"
          for i in 1 2 3; do
            sudo timeout 180 apt-get $A update -q &&
              sudo timeout 240 apt-get $A install -y -q gcc-arm-none-eabi &&
              sudo chown -R "$USER" "$D" && exit 0
            echo "apt attempt $i failed; retrying"; sleep 10
          done
          exit 1
      - run: make rom
      # agent-emu runs the memory agent on an emulated ARM7
      # System-wide: the tests run python3 -I, which ignores the user site a
      # plain pip install would use.
      # pip as root uses a cache only if root owns it: root's for the install,
      # the runner's again for the cache step to save
      - name: cache pip's wheels
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: /tmp/pip-ci
          key: pip-unicorn-2.1.1-${{ env.ImageOS }}-${{ env.ImageVersion }}
      - run: |
          sudo mkdir -p /tmp/pip-ci && sudo chown -R root:root /tmp/pip-ci
          sudo python3 -m pip install --break-system-packages -q --cache-dir /tmp/pip-ci unicorn==2.1.1
          sudo chown -R "$USER" /tmp/pip-ci
      # pret's librfu, which fetch_librfu.sh clones at the commit it pins
      - name: cache librfu
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: build/ref/pokefirered
          key: librfu-${{ hashFiles('test/gblink_sim/fetch_librfu.sh') }}
      - run: make
        env:
          REQUIRE_EMU: '1'
      # ... and the agent built here with GCC, not only the committed image
      - run: make -C rom agent AGENT=../build/agent-gcc.mb && make agent-emu AGENT_IMAGE=build/agent-gcc.mb
        env:
          REQUIRE_EMU: '1'
      - run: make strict
      - run: make gblink-asan

  compat:
    # GB-Link's netplay bridge, Celio, the web apps, the launcher (in Chrome)
    # and GB-Link-Switch-LDN's link task, at the commits run.sh pins.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
      # Celio-Server listens on 443, fixed in its source; let it, unmodified.
      - run: sudo sysctl -w net.ipv4.ip_unprivileged_port_start=0
      # the GB-Link and Celio clones at run.sh's pins, and npm's downloads;
      # run.sh checks every pin out again, so a stale cache costs a fetch
      - name: cache the GB-Link clones and npm
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            build/gblink_compat/src
            ~/.npm
          key: compat-${{ hashFiles('test/gblink_compat/run.sh', 'test/gblink_compat/build.mjs') }}
          restore-keys: compat-
      - run: make compat
        env:
          CHROMIUM: /usr/bin/google-chrome

  compat-heads:
    # The same against GB-Link's current heads, weekly: says when upstream
    # moved in a way that matters, without blocking anyone's push.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
      - run: sudo sysctl -w net.ipv4.ip_unprivileged_port_start=0
      # the GB-Link and Celio clones at run.sh's pins, and npm's downloads;
      # run.sh checks every pin out again, so a stale cache costs a fetch
      - name: cache the GB-Link clones and npm
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            build/gblink_compat/src
            ~/.npm
          key: compat-${{ hashFiles('test/gblink_compat/run.sh', 'test/gblink_compat/build.mjs') }}
          restore-keys: compat-
      - run: make compat
        env:
          CHROMIUM: /usr/bin/google-chrome
          GBLINK_COMPAT_HEADS: '1'

  hardware:
    # Each image with ESP-IDF, as tools/build_hw.sh builds it.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.6
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: link, board: devkit }
          - { variant: gate, board: devkit }
          - { variant: full, board: devkit }
          - { variant: mini, board: devkit }
          - { variant: mini, board: supermini }
          - { variant: gate, board: devkit, bridge: 1 }
          - { variant: gate, board: carrier-touch }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      # compiled objects, per image: a push that touches a few files rebuilds
      # those, not ESP-IDF
      - name: cache ccache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: .ccache
          key: ccache-${{ matrix.variant }}-${{ matrix.board }}-${{ matrix.bridge }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.variant }}-${{ matrix.board }}-${{ matrix.bridge }}-
      - name: build ${{ matrix.variant }} (${{ matrix.board }}${{ matrix.bridge && ', bridge' || '' }})
        shell: bash
        run: |
          . "$IDF_PATH/export.sh" >/dev/null
          if command -v ccache >/dev/null; then
            export IDF_CCACHE_ENABLE=1 CCACHE_DIR="$PWD/.ccache" CCACHE_MAXSIZE=400M
          fi
          if [ -n "${{ matrix.bridge }}" ]; then export BOARD_HAS_BRIDGE=1; fi
          BOARD=${{ matrix.board }} tools/build_hw.sh ${{ matrix.variant }}

  emulator:
    # The hardware images on qemu_esp32 (Espressif's QEMU with HelaFaye's S3
    # patches): the board's own drivers against emulated parts, the picture
    # read back from the glass and the touch pressed (qemu/accurate.sh).
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: QEMU build dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq ninja-build pkg-config libglib2.0-dev libpixman-1-dev \
            libgcrypt20-dev libslirp-dev flex bison python3-venv mtools >/dev/null
      - name: which fork commit
        id: fork
        shell: bash
        run: echo "rev=$(sed -n 's/^FORK_REV="${FORK_REV:-\([0-9a-f]*\)}".*/\1/p' qemu/accurate.sh)" >> "$GITHUB_OUTPUT"
      # The emulator, per pinned fork commit: twenty minutes to build, so built once
      - name: cache the emulator
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: build/esp-qemu
          key: esp-qemu-${{ steps.fork.outputs.rev }}
      - name: cache ccache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: .ccache
          key: ccache-emulator-${{ github.sha }}
          restore-keys: ccache-emulator-
      - name: build the emulator
        shell: bash
        run: ./qemu/accurate.sh build
      - name: boot the touch carrier and the devkit
        shell: bash
        run: |
          . "$IDF_PATH/export.sh" >/dev/null
          if command -v ccache >/dev/null; then
            export IDF_CCACHE_ENABLE=1 CCACHE_DIR="$PWD/.ccache" CCACHE_MAXSIZE=400M
          fi
          ./qemu/accurate.sh boot gate carrier-touch
          ./qemu/accurate.sh boot gate devkit
      - name: screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: emulator-screens
          path: build/hw-gate-*/accurate/*.ppm
          if-no-files-found: ignore
